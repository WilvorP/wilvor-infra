name: Wilvor CI

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  CI_PROFILE: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci-full') && 'pr' || 'full' }}
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  CHECKPOINT_DISABLE: "1"
  TF_IN_AUTOMATION: "true"

jobs:
  discovery:
    name: Workflow security and test discovery
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            tests/requirements-*.txt
            functions/weather/sigmet/processor/requirements.txt
      - run: python -m pip install -r tests/requirements-ci.txt
      - name: Install checksum-pinned actionlint (setup only)
        run: python scripts/ci_bootstrap.py
      - name: Validate Actions syntax and expressions
        run: ./test-results/ci-tools/actionlint/actionlint.exe -shellcheck= -pyflakes= .github/workflows/ci.yml
      - name: Validate workflow security policy
        run: python scripts/ci.py policy
      - name: Collect and classify every test
        id: inventory
        run: python scripts/ci.py discover --profile $env:CI_PROFILE
      - name: Test CI accounting and security helpers
        run: python scripts/ci.py run --group governance
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-inventory
          path: test-results/ci/inventory.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-results-governance
          path: |
            test-results/ci/governance/junit.xml
            test-results/ci/governance/results.json
            test-results/ci/governance/coverage.xml
            test-results/ci/governance/coverage.data
          if-no-files-found: error
          retention-days: 7

  python:
    name: Python / ${{ matrix.group }}
    needs: discovery
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discovery.outputs.matrix) }}
    env:
      CI_GROUP: ${{ matrix.group }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            tests/requirements-*.txt
            functions/weather/sigmet/processor/requirements.txt
      - run: python -m pip install -r tests/requirements-test.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-inventory
          path: test-results/ci
      - name: Run owned offline tests and reports
        run: python scripts/ci.py run --group $env:CI_GROUP
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-results-${{ matrix.group }}
          path: |
            test-results/ci/${{ matrix.group }}/junit.xml
            test-results/ci/${{ matrix.group }}/results.json
            test-results/ci/${{ matrix.group }}/coverage.xml
            test-results/ci/${{ matrix.group }}/coverage.data
          if-no-files-found: error
          retention-days: 7

  terraform:
    name: Terraform and offline infrastructure
    needs: discovery
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            tests/requirements-*.txt
            functions/weather/sigmet/processor/requirements.txt
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - run: python -m pip install -r tests/requirements-infrastructure.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-inventory
          path: test-results/ci
      - name: Formatting; full profile also initializes and validates both isolated roots
        run: python scripts/ci_terraform.py --profile $env:CI_PROFILE
      - name: Run owned infrastructure and AI route contracts
        run: python scripts/ci.py run --group infrastructure
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-results-infrastructure
          path: |
            test-results/ci/infrastructure/junit.xml
            test-results/ci/infrastructure/results.json
            test-results/ci/infrastructure/coverage.xml
            test-results/ci/infrastructure/coverage.data
            test-results/ci/terraform/dev.json
            test-results/ci/terraform/dev-historical-data.json
          if-no-files-found: error
          retention-days: 7

  dashboard:
    name: React dashboard
    needs: discovery
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: npm.cmd ci --no-audit --no-fund
      - name: ESLint
        env:
          NODE_OPTIONS: --require=./scripts/offline.cjs
        run: npm.cmd run lint
      - name: TypeScript
        env:
          NODE_OPTIONS: --require=./scripts/offline.cjs
        run: npm.cmd run typecheck
      - name: Collect all dashboard test cases
        if: env.CI_PROFILE == 'full'
        env:
          NODE_OPTIONS: --require=./scripts/offline.cjs
        run: node node_modules/vitest/vitest.mjs list --json=../test-results/ci/dashboard/expected.json --no-cache
      - name: Vitest with coverage and reports
        if: env.CI_PROFILE == 'full'
        env:
          NODE_OPTIONS: --require=./scripts/offline.cjs
        run: npm.cmd test -- --coverage --reporter=default --reporter=junit --reporter=json --outputFile.junit=../test-results/ci/dashboard/junit.xml --outputFile.json=../test-results/ci/dashboard/vitest.json
      - name: Production build
        if: env.CI_PROFILE == 'full'
        env:
          NODE_OPTIONS: --require=./scripts/offline.cjs
        run: npm.cmd run build
      - name: Dashboard accounting and summary
        if: always()
        working-directory: .
        run: python scripts/ci.py dashboard --profile $env:CI_PROFILE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && env.CI_PROFILE == 'full'
        with:
          name: ci-results-dashboard
          path: |
            test-results/ci/dashboard/junit.xml
            test-results/ci/dashboard/results.json
            test-results/ci/dashboard/coverage-summary.json
            test-results/ci/dashboard/coverage/lcov.info
            test-results/ci/dashboard/coverage/cobertura-coverage.xml
          if-no-files-found: error
          retention-days: 7

  security:
    name: Security / ${{ matrix.scan }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scan: [secrets, python-dependencies, npm-dependencies, terraform-security]
    env:
      CI_SCAN: ${{ matrix.scan }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.scan == 'npm-dependencies'
        with:
          node-version: "22"
      - name: Install pinned/checksummed scanner (public setup downloads)
        run: python scripts/ci_security.py bootstrap --scan $env:CI_SCAN
      - name: Run required scan and publish value-free findings
        run: python scripts/ci_security.py run --scan $env:CI_SCAN
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-security-${{ matrix.scan }}
          path: test-results/ci/security/${{ matrix.scan }}/scan.json
          if-no-files-found: error
          retention-days: 7

  quality-gate:
    name: CI quality gate
    if: always()
    needs: [discovery, python, terraform, dashboard, security]
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install "coverage>=7.10.6,<8"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-inventory
          path: test-results/ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ci-results-*
          path: test-results/ci/downloads
          merge-multiple: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ci-security-*
          path: test-results/ci/downloads
          merge-multiple: false
      - name: Require successful jobs, complete execution and all reports
        if: always()
        run: python scripts/ci.py gate --profile $env:CI_PROFILE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-aggregate
          path: |
            test-results/ci/aggregate/coverage.xml
            test-results/ci/aggregate/gate.json
          if-no-files-found: error
          retention-days: 7
